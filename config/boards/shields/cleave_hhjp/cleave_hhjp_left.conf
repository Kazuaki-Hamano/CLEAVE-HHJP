# Cleave HHJP - Left Side (Central) Configuration

# Mouse reports are sent by the central; this side-specific file is loaded by the build.
CONFIG_ZMK_POINTING=y

# Collect the right half's battery level in the central firmware.
# The build loads this side-specific file instead of cleave_hhjp.conf.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_USB_HID_DEVICE_COUNT=2

# ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
