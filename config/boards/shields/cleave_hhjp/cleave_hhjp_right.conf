# DYA split protocol baseline for the peripheral.
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# DYA enlarges split command/event payloads; retain headroom for BLE calls.
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_STACK_SIZE=2048

# Deep sleep after 30 minutes of inactivity; key wake verified on both halves.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# DYA activity settings: both halves handle changes/reports over split relay.
CONFIG_ZMK_SETTINGS_RPC=y

# Right-side topology/statistics are queried through the left Studio connection.
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=70
CONFIG_ZMK_KSCAN_DIAGNOSTICS_RELAY_STACK_SIZE=4096

# DYA stability: local incidents on each half, software-only freeze watchdog.
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_MAX_INCIDENTS=16
CONFIG_ZMK_WATCHDOG_FREEZE_DETECT=y
CONFIG_ZMK_WATCHDOG_FREEZE_TIMEOUT_MS=30000
CONFIG_ZMK_WATCHDOG_FREEZE_FEED_DIVISOR=2
CONFIG_ZMK_WATCHDOG_FREEZE_STARTUP_DELAY_MS=30000
CONFIG_ZMK_WATCHDOG_FATAL_DETECT=y
CONFIG_ZMK_WATCHDOG_SPLIT_RELAY=y
CONFIG_ZMK_WATCHDOG_TEST_INJECTION=n
CONFIG_TASK_WDT_HW_FALLBACK=n

# Hardware PWM only on the three RGB LED pins; never the CHG pin.
CONFIG_PWM=y
CONFIG_LED_PWM=y
