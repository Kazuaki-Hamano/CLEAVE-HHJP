name: Build ZMK firmware
on:
  push:
    branches:
      - main
      - feature/dya-studio
      - feature/dya-connection-settings
      - feature/deep-sleep-trial
      - feature/dya-activity-settings
      - feature/dya-trackpad-settings
      - feature/dya-split-status
    paths:
      - 'config/**'
      - 'src/**'
      - 'modules/**'
      - 'dts/**'
      - 'zephyr/**'
      - 'Kconfig'
      - 'tools/battery/**'
      - 'CMakeLists.txt'
      - 'build.yaml'
      - '.github/workflows/build-firmware.yml'
  pull_request:
    paths:
      - 'config/**'
      - 'src/**'
      - 'modules/**'
      - 'dts/**'
      - 'zephyr/**'
      - 'Kconfig'
      - 'tools/battery/**'
      - 'CMakeLists.txt'
      - 'build.yaml'
      - '.github/workflows/build-firmware.yml'

jobs:
  build:
    uses: cormoran/zmk/.github/workflows/build-user-config.yml@e5c9b6915b56801193e359dd9bad4a167ce0d1b8
